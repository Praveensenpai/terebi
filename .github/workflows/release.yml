name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Tarball (.tar.gz)
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          PKG_NAME="terebi-${TAG_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/x86_64-unknown-linux-gnu/release/terebi" "dist/${PKG_NAME}/"
          cp README.md LICENSE "dist/${PKG_NAME}/"
          file "dist/${PKG_NAME}/terebi"
          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: terebi-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-all
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd dist-all
          sha256sum *.tar.gz > SHA256SUMS.txt
          cd ..

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-all/*.tar.gz
            dist-all/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
