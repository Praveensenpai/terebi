[package]
name = "terebi"
version = "0.1.1"
edition = "2021"
authors = ["Praveensenpai <pvnt20@gmail.com>"]
description = "Aesthetic, pure-Rust Smart TV Telegram controller & watchdog via ADB"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[lints.rust]
unused = "deny"
dead_code = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
